name: Momos Spot · Android APK

on:
  push:
    paths:
      - 'momos-spot/**'
      - '.github/workflows/momos-spot-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: momos-spot
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: momos-spot/package-lock.json

      - name: Install, test and build the app
        env:
          # Optional override of the cloud project in momos-spot/.env.production
          # (repository variables or secrets VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY)
          CLOUD_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          CLOUD_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$CLOUD_URL" ] && [ -n "$CLOUD_KEY" ]; then
            export VITE_SUPABASE_URL="$CLOUD_URL" VITE_SUPABASE_ANON_KEY="$CLOUD_KEY"
          fi
          npm ci
          npm test
          npm run build
          grep -q "supabase.co" dist/assets/*.js && echo "Cloud project is built in." || echo "No cloud project built in."

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # Signing: Android only installs an update signed with the same key as the installed app.
      # If the MOMOS_KEYSTORE_BASE64 / MOMOS_KEYSTORE_PASSWORD secrets exist, that key is used.
      # Otherwise one key is generated on the first build and kept in this repository's private
      # Actions cache (never in the code), so every later build is signed the same way.
      - name: Restore the app signing key
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: ~/momos-signing
          key: momos-spot-signing-key-v1

      - name: Choose the signing key
        env:
          KS_B64: ${{ secrets.MOMOS_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MOMOS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/momos.keystore"
            echo "MOMOS_KEYSTORE_FILE=$RUNNER_TEMP/momos.keystore" >> "$GITHUB_ENV"
            echo "MOMOS_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_SOURCE=secret" >> "$GITHUB_ENV"
            echo "Signing with the key from repository secrets."
          else
            mkdir -p "$HOME/momos-signing"
            if [ ! -f "$HOME/momos-signing/momos.keystore" ]; then
              keytool -genkeypair -keystore "$HOME/momos-signing/momos.keystore" -alias momosspot \
                -keyalg RSA -keysize 2048 -validity 36500 -storepass android -keypass android \
                -dname "CN=The Momos Spot, O=The Momos Spot, C=IN"
              echo "Created a new signing key (first build)."
            else
              echo "Reusing the saved signing key."
            fi
            echo "MOMOS_KEYSTORE_FILE=$HOME/momos-signing/momos.keystore" >> "$GITHUB_ENV"
            echo "MOMOS_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_SOURCE=cache" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../MomosSpot.apk
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs ../MomosSpot.apk | grep -i "SHA-256"

      - name: Save the app signing key
        if: steps.keycache.outputs.cache-hit != 'true' && env.KEY_SOURCE == 'cache'
        uses: actions/cache/save@v4
        with:
          path: ~/momos-signing
          key: momos-spot-signing-key-v1

      - uses: actions/upload-artifact@v4
        with:
          name: MomosSpot-apk
          path: momos-spot/MomosSpot.apk

      - name: Publish as the latest download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: momos-spot-latest
          name: The Momos Spot app (latest)
          prerelease: false
          make_latest: false
          body: |
            Download **MomosSpot.apk** on the shop phone and open it to install or update.
            Build ${{ github.run_number }} from `${{ github.ref_name }}` (${{ github.sha }}).
            Updates install over the old version and keep all data.
          files: momos-spot/MomosSpot.apk
